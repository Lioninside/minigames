name: Smoke-Test

# Lädt die Startseite und jedes Spiel in einem echten Browser und schlägt fehl, sobald
# JavaScript-Fehler, fehlende Dateien oder eine nicht startende 3D-Szene auftreten.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund

      - name: Chromium bereitstellen
        run: npx playwright install --with-deps chromium

      - name: Spiele prüfen
        run: npm test
