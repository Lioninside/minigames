<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Zahnradbergbahn aus der Cockpit-Sicht.">
  <title>Zahnradbergbahn</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: #17231b; color: #f4f0df; font-family: "Segoe UI", Arial, sans-serif; }
    #game { position: fixed; inset: 0; cursor: grab; }
    #game.dragging { cursor: grabbing; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
    .panel { position: absolute; border: 1px solid rgba(247, 239, 210, 0.42); background: rgba(16, 25, 19, 0.72); box-shadow: 0 4px 18px rgba(0, 0, 0, 0.2); }
    #title { top: 18px; left: 20px; padding: 9px 12px; font-size: 11px; font-weight: 800; letter-spacing: 0; }
    #speed { bottom: 22px; left: 22px; width: 126px; padding: 10px 12px; font-variant-numeric: tabular-nums; }
    #speed strong { display: block; color: #f6c74b; font-size: 34px; line-height: 1; }
    #speed span { color: #d3ddd2; font-size: 12px; }
    #status { bottom: 22px; left: 164px; padding: 10px 12px; color: #d3ddd2; font-size: 12px; }
    #map-wrap { top: 18px; right: 20px; width: 196px; height: 164px; padding: 7px; }
    #map { display: block; width: 180px; height: 148px; }
    #crosshair { position: absolute; top: 50%; left: 50%; width: 8px; height: 8px; border: 1px solid rgba(255,255,255,0.82); border-radius: 50%; transform: translate(-50%, -50%); }
    #message { position: absolute; top: 54%; left: 50%; transform: translate(-50%, -50%); padding: 12px 18px; border: 1px solid rgba(255, 223, 116, 0.75); background: rgba(28, 20, 13, 0.78); color: #ffe1a3; font-size: 17px; font-weight: 800; opacity: 0; transition: opacity 160ms linear; }
    #message.visible { opacity: 1; }
    #failure { position: fixed; inset: 0; display: grid; place-items: center; z-index: 5; background: rgba(14, 19, 16, 0.88); text-align: center; }
    #failure[hidden] { display: none; }
    #failure h1 { margin: 0; font-size: 28px; }
    @media (max-width: 640px) {
      #title { top: 10px; left: 10px; }
      #map-wrap { top: 10px; right: 10px; transform: scale(0.78); transform-origin: top right; }
      #speed { bottom: 12px; left: 12px; }
      #status { bottom: 12px; left: 150px; max-width: calc(100% - 162px); }
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="hud">
    <div id="title" class="panel">ZAHNRADBERGBAHN</div>
    <div id="map-wrap" class="panel"><canvas id="map" width="360" height="296"></canvas></div>
    <div id="speed" class="panel"><strong id="speedValue">0</strong><span>km/h</span></div>
    <div id="status" class="panel">Talstation</div>
    <div id="crosshair"></div>
    <div id="message"></div>
  </div>
  <div id="failure" hidden><h1>Three.js konnte nicht geladen werden.</h1></div>

  <script>
  (() => {
    "use strict";

    if (!window.THREE) {
      document.getElementById("failure").hidden = false;
      return;
    }

    const game = document.getElementById("game");
    const speedValue = document.getElementById("speedValue");
    const status = document.getElementById("status");
    const message = document.getElementById("message");
    const mapCanvas = document.getElementById("map");
    const mapContext = mapCanvas.getContext("2d");
    const clock = new THREE.Clock();
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9ab9c0);
    scene.fog = new THREE.Fog(0x9ab9c0, 65, 225);

    const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.1, 450);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.7));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    game.append(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xe9f5ff, 0x34432f, 1.5));
    const sun = new THREE.DirectionalLight(0xfff2cf, 1.9);
    sun.position.set(80, 130, 42);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    scene.add(sun);

    const UP = new THREE.Vector3(0, 1, 0);
    const FORWARD = new THREE.Vector3(0, 0, -1);
    const Z_AXIS = new THREE.Vector3(0, 0, 1);
    const state = {
      speed: 0,
      trainT: 0.032,
      doorsOpen: false,
      playerMode: "walking",
      playerPosition: new THREE.Vector3(0, 1.85, -0.4),
      yaw: 0,
      pitch: -0.03,
      derailTimer: 0,
      messageTimer: 0,
      passengerCount: 0,
      tachoValue: -1
    };
    const keys = new Set();
    const clickTargets = [];
    const switches = [];
    const stationData = [];
    const hikers = [];
    let drag = null;
    let aiT = 0.82;

    function showMessage(text, seconds) {
      message.textContent = text;
      message.classList.add("visible");
      state.messageTimer = seconds;
    }

    function terrainHeight(x, z) {
      const ridge = 16 * Math.exp(-((x + 8) * (x + 8)) / 220 - ((z + 8) * (z + 8)) / 220);
      const distant = 26 * Math.exp(-((x - 55) * (x - 55)) / 950 - ((z + 46) * (z + 46)) / 1300);
      const waviness = Math.sin(x * 0.095) * 2.1 + Math.cos(z * 0.07) * 1.8 + Math.sin((x + z) * 0.052) * 2.5;
      return ridge + distant + waviness - 7;
    }

    function seeded(seed) {
      let value = seed >>> 0;
      return () => {
        value = (value * 1664525 + 1013904223) >>> 0;
        return value / 4294967296;
      };
    }

    function createTerrain() {
      const geometry = new THREE.PlaneGeometry(270, 250, 88, 82);
      geometry.rotateX(-Math.PI / 2);
      const positions = geometry.attributes.position;
      const colors = [];
      for (let index = 0; index < positions.count; index += 1) {
        const x = positions.getX(index);
        const z = positions.getZ(index);
        const y = terrainHeight(x, z);
        positions.setY(index, y);
        const shade = Math.max(0, Math.min(1, (y + 12) / 52));
        colors.push(0.20 + shade * 0.19, 0.37 + shade * 0.22, 0.19 + shade * 0.13);
      }
      geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
      geometry.computeVertexNormals();
      const terrain = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1 }));
      terrain.receiveShadow = true;
      scene.add(terrain);
    }

    function createNature() {
      const random = seeded(42);
      const treeCount = 340;
      const treeGeometry = new THREE.ConeGeometry(0.8, 4.2, 7);
      const treeMaterial = new THREE.MeshStandardMaterial({ color: 0x28583b, roughness: 0.96 });
      const trees = new THREE.InstancedMesh(treeGeometry, treeMaterial, treeCount);
      const trunkGeometry = new THREE.CylinderGeometry(0.13, 0.18, 1.5, 6);
      const trunks = new THREE.InstancedMesh(trunkGeometry, new THREE.MeshStandardMaterial({ color: 0x56432c, roughness: 1 }), treeCount);
      const matrix = new THREE.Matrix4();
      const quaternion = new THREE.Quaternion();
      const scale = new THREE.Vector3();
      for (let index = 0; index < treeCount; index += 1) {
        const x = random() * 230 - 115;
        const z = random() * 210 - 105;
        const y = terrainHeight(x, z);
        const size = 0.55 + random() * 1.25;
        quaternion.setFromAxisAngle(UP, random() * Math.PI * 2);
        scale.set(size, size * (0.78 + random() * 0.55), size);
        matrix.compose(new THREE.Vector3(x, y + 2.1 * scale.y, z), quaternion, scale);
        trees.setMatrixAt(index, matrix);
        matrix.compose(new THREE.Vector3(x, y + 0.75 * scale.y, z), quaternion, new THREE.Vector3(scale.x * 0.7, scale.y, scale.z * 0.7));
        trunks.setMatrixAt(index, matrix);
      }
      trees.castShadow = true;
      trunks.castShadow = true;
      scene.add(trees, trunks);

      const stoneCount = 150;
      const stones = new THREE.InstancedMesh(new THREE.DodecahedronGeometry(0.7, 0), new THREE.MeshStandardMaterial({ color: 0x728075, roughness: 1 }), stoneCount);
      for (let index = 0; index < stoneCount; index += 1) {
        const x = random() * 220 - 110;
        const z = random() * 200 - 100;
        const size = 0.35 + random() * 1.5;
        quaternion.setFromEuler(new THREE.Euler(random(), random(), random()));
        matrix.compose(new THREE.Vector3(x, terrainHeight(x, z) + size * 0.35, z), quaternion, new THREE.Vector3(size, size * (0.55 + random() * 0.5), size));
        stones.setMatrixAt(index, matrix);
      }
      stones.castShadow = true;
      scene.add(stones);
    }

    createTerrain();
    createNature();

    const mainPoints = [
      new THREE.Vector3(0, 0.8, 66), new THREE.Vector3(0, 2.2, 49), new THREE.Vector3(1.5, 5.3, 36),
      new THREE.Vector3(8.5, 12.5, 20), new THREE.Vector3(7.4, 19.2, 4), new THREE.Vector3(-5.8, 28.2, -20),
      new THREE.Vector3(-7.2, 35.2, -42), new THREE.Vector3(0, 43.5, -65)
    ];
    const aiPoints = mainPoints.map((point) => new THREE.Vector3(point.x + 4.1, point.y, point.z));
    const mainTrackCurve = new THREE.CatmullRomCurve3(mainPoints, false, "centripetal");
    const aiTrackCurve = new THREE.CatmullRomCurve3(aiPoints, false, "centripetal");
    const mainLength = mainTrackCurve.getLength();

    function frameAt(curve, t) {
      const point = curve.getPointAt(t);
      const tangent = curve.getTangentAt(t).normalize();
      const side = new THREE.Vector3().crossVectors(UP, tangent).normalize();
      const quaternion = new THREE.Quaternion().setFromUnitVectors(Z_AXIS, tangent);
      return { point, tangent, side, quaternion };
    }

    function buildRackTrack(curve, railColor) {
      const segments = 240;
      const railGeometry = new THREE.BoxGeometry(0.13, 0.14, mainLength / segments + 0.18);
      const sleeperGeometry = new THREE.BoxGeometry(3.25, 0.17, 0.18);
      const rackGeometry = new THREE.BoxGeometry(0.20, 0.26, 0.38);
      const railMaterial = new THREE.MeshStandardMaterial({ color: railColor, metalness: 0.62, roughness: 0.34 });
      const sleeperMaterial = new THREE.MeshStandardMaterial({ color: 0x4f3827, roughness: 0.93 });
      const rackMaterial = new THREE.MeshStandardMaterial({ color: 0xbd933d, metalness: 0.58, roughness: 0.34 });
      const rails = new THREE.InstancedMesh(railGeometry, railMaterial, segments * 2);
      const sleepers = new THREE.InstancedMesh(sleeperGeometry, sleeperMaterial, segments / 2);
      const rack = new THREE.InstancedMesh(rackGeometry, rackMaterial, segments);
      const matrix = new THREE.Matrix4();
      let railIndex = 0;
      let sleeperIndex = 0;
      for (let index = 0; index < segments; index += 1) {
        const frame = frameAt(curve, (index + 0.5) / segments);
        [-1.16, 1.16].forEach((offset) => {
          matrix.compose(frame.point.clone().addScaledVector(frame.side, offset).addScaledVector(UP, 0.16), frame.quaternion, new THREE.Vector3(1, 1, 1));
          rails.setMatrixAt(railIndex, matrix);
          railIndex += 1;
        });
        matrix.compose(frame.point.clone().addScaledVector(UP, 0.12), frame.quaternion, new THREE.Vector3(1, 1, 1));
        rack.setMatrixAt(index, matrix);
        if (index % 2 === 0) {
          matrix.compose(frame.point.clone().addScaledVector(UP, 0.02), frame.quaternion, new THREE.Vector3(1, 1, 1));
          sleepers.setMatrixAt(sleeperIndex, matrix);
          sleeperIndex += 1;
        }
      }
      rails.instanceMatrix.needsUpdate = true;
      sleepers.instanceMatrix.needsUpdate = true;
      rack.instanceMatrix.needsUpdate = true;
      rails.castShadow = sleepers.castShadow = rack.castShadow = true;
      scene.add(rails, sleepers, rack);
    }

    buildRackTrack(mainTrackCurve, 0x27302f);
    buildRackTrack(aiTrackCurve, 0x394442);

    function makeTextSprite(text, foreground, background) {
      const canvas = document.createElement("canvas");
      canvas.width = 256;
      canvas.height = 128;
      const context = canvas.getContext("2d");
      context.fillStyle = background;
      context.fillRect(0, 0, canvas.width, canvas.height);
      context.strokeStyle = "#ffffff";
      context.lineWidth = 8;
      context.strokeRect(6, 6, canvas.width - 12, canvas.height - 12);
      context.fillStyle = foreground;
      context.font = "bold 70px Arial";
      context.textAlign = "center";
      context.textBaseline = "middle";
      context.fillText(text, 128, 68);
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas), transparent: true }));
      sprite.scale.set(3.8, 1.9, 1);
      return sprite;
    }

    function createSpeedSign(t, limit) {
      const frame = frameAt(mainTrackCurve, t);
      const post = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.09, 2.7, 8), new THREE.MeshStandardMaterial({ color: 0x49504b, roughness: 0.7 }));
      post.position.copy(frame.point).addScaledVector(frame.side, 3.1).addScaledVector(UP, 1.25);
      post.castShadow = true;
      const sign = makeTextSprite(String(limit), "#222222", "#f5f2e8");
      sign.position.copy(post.position).addScaledVector(UP, 1.55);
      scene.add(post, sign);
    }

    createSpeedSign(0.17, 25);
    createSpeedSign(0.39, 15);
    createSpeedSign(0.65, 25);
    createSpeedSign(0.88, 15);

    function buildCar(colorA, colorB, passengerView) {
      const car = new THREE.Group();
      const lower = new THREE.Mesh(new THREE.BoxGeometry(3.85, 0.78, 10.8), new THREE.MeshStandardMaterial({ color: colorB, roughness: 0.52 }));
      lower.position.y = 1.05;
      const upper = new THREE.Mesh(new THREE.BoxGeometry(4.05, 1.55, 10.2), new THREE.MeshStandardMaterial({ color: colorA, roughness: 0.47 }));
      upper.position.y = 2.18;
      const roof = new THREE.Mesh(new THREE.BoxGeometry(4.34, 0.22, 10.8), new THREE.MeshStandardMaterial({ color: 0x22312c, roughness: 0.7 }));
      roof.position.y = passengerView ? 3.62 : 3.06;
      car.add(lower, roof);
      if (passengerView) {
        [-1, 1].forEach((side) => {
          const sideBand = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.62, 10.2), new THREE.MeshStandardMaterial({ color: colorA, roughness: 0.47 }));
          sideBand.position.set(side * 1.96, 1.92, 0);
          car.add(sideBand);
          [-4.55, -2.2, 0, 2.2, 4.55].forEach((z) => {
            const frame = new THREE.Mesh(new THREE.BoxGeometry(0.2, 1.65, 0.16), new THREE.MeshStandardMaterial({ color: colorA, roughness: 0.52 }));
            frame.position.set(side * 1.96, 2.73, z);
            car.add(frame);
          });
        });
      } else {
        car.add(upper);
        for (let index = -3; index <= 3; index += 1) {
          [-2.04, 2.04].forEach((x) => {
            const window = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.65, 0.035), new THREE.MeshStandardMaterial({ color: 0x92cbd3, emissive: 0x1b4b53, emissiveIntensity: 0.22 }));
            window.position.set(x, 2.3, index * 1.25);
            window.rotation.y = Math.PI / 2;
            car.add(window);
          });
        }
      }
      car.traverse((part) => { if (part.isMesh) part.castShadow = true; });
      return car;
    }

    const trainRoot = new THREE.Group();
    trainRoot.add(buildCar(0xe6b933, 0x255d9a, true));
    scene.add(trainRoot);

    const cabin = new THREE.Group();
    const red = new THREE.MeshStandardMaterial({ color: 0x8d2e28, roughness: 0.8, side: THREE.DoubleSide });
    const black = new THREE.MeshStandardMaterial({ color: 0x151918, roughness: 0.92 });
    const floor = new THREE.Mesh(new THREE.BoxGeometry(3.7, 0.08, 9.9), red);
    floor.position.set(0, 1.47, 0);
    const ceiling = new THREE.Mesh(new THREE.BoxGeometry(3.72, 0.08, 9.8), red);
    ceiling.position.set(0, 3.48, 0);
    const dashboard = new THREE.Mesh(new THREE.BoxGeometry(3.25, 0.3, 0.6), black);
    dashboard.position.set(0, 1.54, -4.05);
    cabin.add(floor, ceiling, dashboard);
    [-1, 1].forEach((side) => {
      const lowerWall = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.55, 9.8), red);
      lowerWall.position.set(side * 1.83, 1.78, 0);
      cabin.add(lowerWall);
      [-4.45, -2.25, 0, 2.25, 4.45].forEach((z) => {
        const pillar = new THREE.Mesh(new THREE.BoxGeometry(0.11, 1.7, 0.16), red);
        pillar.position.set(side * 1.83, 2.62, z);
        cabin.add(pillar);
      });
    });
    [-1.12, 1.12].forEach((x) => {
      [-0.5, 1.5, 3.5].forEach((z) => {
        const bench = new THREE.Mesh(new THREE.BoxGeometry(0.72, 0.5, 1.45), black);
        bench.position.set(x, 1.78, z);
        cabin.add(bench);
      });
    });
    const driverSeat = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.65, 0.9), black);
    driverSeat.position.set(0, 1.78, -3.05);
    cabin.add(driverSeat);
    trainRoot.add(cabin);

    const doorPanels = [];
    [-1, 1].forEach((side) => {
      const door = new THREE.Mesh(new THREE.BoxGeometry(0.08, 1.45, 1.2), new THREE.MeshStandardMaterial({ color: 0xe6b933, roughness: 0.5 }));
      door.position.set(side * 1.93, 2.15, 2.85);
      trainRoot.add(door);
      doorPanels.push({ door, side, closedZ: 2.85 });
    });

    const viewYaw = new THREE.Object3D();
    const viewPitch = new THREE.Object3D();
    viewYaw.add(viewPitch);
    viewPitch.add(camera);
    trainRoot.add(viewYaw);

    const tachoCanvas = document.createElement("canvas");
    tachoCanvas.width = 256;
    tachoCanvas.height = 256;
    const tachoContext = tachoCanvas.getContext("2d");
    const tachoTexture = new THREE.CanvasTexture(tachoCanvas);
    const tacho = new THREE.Mesh(new THREE.PlaneGeometry(1.35, 1.35), new THREE.MeshBasicMaterial({ map: tachoTexture, side: THREE.DoubleSide }));
    tacho.scale.setScalar(0.8);
    tacho.position.set(0, 1.88, -4.37);
    cabin.add(tacho);

    function drawTacho() {
      const value = Math.round(Math.abs(state.speed));
      if (value === state.tachoValue) return;
      state.tachoValue = value;
      const ctx = tachoContext;
      ctx.clearRect(0, 0, 256, 256);
      ctx.fillStyle = "#101515";
      ctx.beginPath(); ctx.arc(128, 128, 117, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#d8d1b3"; ctx.lineWidth = 7;
      ctx.beginPath(); ctx.arc(128, 128, 106, Math.PI * 0.72, Math.PI * 2.28); ctx.stroke();
      for (let index = 0; index <= 6; index += 1) {
        const angle = Math.PI * 0.72 + index / 6 * Math.PI * 1.56;
        ctx.strokeStyle = "#f5e6ac"; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(128 + Math.cos(angle) * 83, 128 + Math.sin(angle) * 83); ctx.lineTo(128 + Math.cos(angle) * 101, 128 + Math.sin(angle) * 101); ctx.stroke();
      }
      const needle = Math.PI * 0.72 + Math.min(30, value) / 30 * Math.PI * 1.56;
      ctx.strokeStyle = value > getSpeedLimit() ? "#e95348" : "#f4c64f"; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.moveTo(128, 128); ctx.lineTo(128 + Math.cos(needle) * 73, 128 + Math.sin(needle) * 73); ctx.stroke();
      ctx.fillStyle = "#f4f1e8"; ctx.font = "bold 40px Arial"; ctx.textAlign = "center"; ctx.fillText(String(value), 128, 154);
      ctx.font = "bold 18px Arial"; ctx.fillStyle = "#cdd6cf"; ctx.fillText("km/h", 128, 180);
      tachoTexture.needsUpdate = true;
    }

    const aiTrain = buildCar(0xf0c33e, 0x306ca2);
    aiTrain.scale.setScalar(0.88);
    scene.add(aiTrain);

    function createStation(name, t, peak) {
      const frame = frameAt(mainTrackCurve, t);
      const root = new THREE.Group();
      root.position.copy(frame.point);
      root.quaternion.copy(frame.quaternion);
      const platform = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.34, 17), new THREE.MeshStandardMaterial({ color: 0xb9b4a2, roughness: 0.9 }));
      platform.position.set(4.0, -0.23, 0);
      platform.receiveShadow = true;
      root.add(platform);
      const sign = makeTextSprite(name.toUpperCase(), "#18323a", "#f1eddc");
      sign.position.set(5.3, 2.3, 0);
      root.add(sign);
      const people = [];
      for (let index = 0; index < 7; index += 1) {
        const person = new THREE.Group();
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.17, 0.7, 7), new THREE.MeshStandardMaterial({ color: index % 2 ? 0x4177a4 : 0xb05740 }));
        body.position.y = 0.55;
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.16, 8, 8), new THREE.MeshStandardMaterial({ color: 0xe2b38b }));
        head.position.y = 1.05;
        person.add(body, head);
        person.position.set(4.7 + (index % 2) * 0.75, 0.15, -5.5 + index * 1.65);
        person.userData = { home: person.position.clone(), action: "idle", progress: 0 };
        root.add(person);
        people.push(person);
      }
      scene.add(root);

      const building = new THREE.Group();
      building.position.copy(frame.point).addScaledVector(frame.side, 12).addScaledVector(UP, 1.8);
      const hotel = new THREE.Mesh(new THREE.BoxGeometry(7, 4.2, 5.6), new THREE.MeshStandardMaterial({ color: peak ? 0x9f6d4b : 0xc4a36a, roughness: 0.82 }));
      hotel.position.y = 2.1;
      hotel.castShadow = true;
      const roof = new THREE.Mesh(new THREE.ConeGeometry(5.4, 2.0, 4), new THREE.MeshStandardMaterial({ color: 0x455447, roughness: 0.9 }));
      roof.position.y = 5.15;
      roof.rotation.y = Math.PI / 4;
      building.add(hotel, roof);
      const hotelLabel = makeTextSprite("HOTEL", "#2b2820", "#ead9a6");
      hotelLabel.position.set(0, 4.3, 2.9);
      building.add(hotelLabel);
      const restaurant = new THREE.Mesh(new THREE.BoxGeometry(4.5, 2.6, 3.8), new THREE.MeshStandardMaterial({ color: 0x9f4b37, roughness: 0.84 }));
      restaurant.position.set(6.5, 1.3, 0.6);
      restaurant.castShadow = true;
      building.add(restaurant);
      const restaurantLabel = makeTextSprite("RESTAURANT", "#ffffff", "#7d3326");
      restaurantLabel.position.set(6.5, 3.0, 2.55);
      restaurantLabel.scale.set(3.2, 1.0, 1);
      building.add(restaurantLabel);
      if (peak) {
        const tower = new THREE.Mesh(new THREE.CylinderGeometry(1.3, 1.7, 13, 10), new THREE.MeshStandardMaterial({ color: 0x6d7269, roughness: 0.72 }));
        tower.position.set(-7.2, 6.5, 1.5);
        const towerTop = new THREE.Mesh(new THREE.ConeGeometry(2.2, 2.5, 8), new THREE.MeshStandardMaterial({ color: 0x2e493a, roughness: 0.8 }));
        towerTop.position.set(-7.2, 14.2, 1.5);
        building.add(tower, towerTop);
      }
      scene.add(building);
      stationData.push({ name, t, people, serviceTime: 0 });
    }

    createStation("Talstation", 0.032, false);
    createStation("Mittelstation", 0.49, false);
    createStation("Bergstation", 0.96, true);

    function createSwitch(t, sideDirection) {
      const frame = frameAt(mainTrackCurve, t);
      const root = new THREE.Group();
      root.position.copy(frame.point).addScaledVector(frame.side, sideDirection * 1.55).addScaledVector(UP, 0.18);
      root.quaternion.copy(frame.quaternion);
      const tie = new THREE.Mesh(new THREE.BoxGeometry(3.1, 0.14, 0.25), new THREE.MeshStandardMaterial({ color: 0x4c3628, roughness: 0.92 }));
      const blade = new THREE.Mesh(new THREE.BoxGeometry(0.10, 0.13, 3.3), new THREE.MeshStandardMaterial({ color: 0x3c7671, metalness: 0.46, roughness: 0.4 }));
      blade.position.set(sideDirection * 0.6, 0.15, 0);
      const lever = new THREE.Mesh(new THREE.SphereGeometry(0.28, 10, 10), new THREE.MeshStandardMaterial({ color: 0xd8b14c, emissive: 0x5a4311, emissiveIntensity: 0.25 }));
      lever.position.set(sideDirection * 1.8, 0.45, 0);
      root.add(tie, blade, lever);
      root.userData = { state: false, blade, lever };
      lever.userData.switchRoot = root;
      clickTargets.push(lever);
      switches.push(root);
      scene.add(root);

      const branchPoints = [
        frame.point.clone().addScaledVector(frame.side, sideDirection * 1.25),
        frame.point.clone().addScaledVector(frame.side, sideDirection * 8).addScaledVector(frame.tangent, 8),
        frame.point.clone().addScaledVector(frame.side, sideDirection * 12).addScaledVector(frame.tangent, 19)
      ];
      const branch = new THREE.CatmullRomCurve3(branchPoints);
      const tube = new THREE.Mesh(new THREE.TubeGeometry(branch, 22, 0.12, 6, false), new THREE.MeshStandardMaterial({ color: 0x45514d, metalness: 0.4, roughness: 0.48 }));
      scene.add(tube);
    }

    createSwitch(0.25, 1);
    createSwitch(0.58, -1);
    createSwitch(0.79, 1);

    function createWalkers() {
      const points = mainTrackCurve.getSpacedPoints(28).map((point, index) => point.clone().add(new THREE.Vector3(index % 2 ? 5.8 : -5.8, 0.18, 0)));
      const trail = new THREE.CatmullRomCurve3(points);
      const mesh = new THREE.Mesh(new THREE.TubeGeometry(trail, 120, 0.18, 5, false), new THREE.MeshStandardMaterial({ color: 0xb9965f, roughness: 1 }));
      scene.add(mesh);
      for (let index = 0; index < 10; index += 1) {
        const walker = new THREE.Group();
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.17, 0.72, 7), new THREE.MeshStandardMaterial({ color: index % 2 ? 0xc65a3f : 0x3f78a6 }));
        body.position.y = 0.48;
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.16, 8, 8), new THREE.MeshStandardMaterial({ color: 0xe1b28a }));
        head.position.y = 0.98;
        walker.add(body, head);
        walker.userData = { t: index / 10, speed: 0.006 + index * 0.00035, trail };
        scene.add(walker);
        hikers.push(walker);
      }
    }

    createWalkers();

    function nearestStation() {
      return stationData.reduce((closest, station) => Math.abs(state.trainT - station.t) < Math.abs(state.trainT - closest.t) ? station : closest, stationData[0]);
    }

    function currentStation() {
      const station = nearestStation();
      return Math.abs(state.trainT - station.t) < 0.038 ? station : null;
    }

    function getSpeedLimit() {
      return currentStation() ? 15 : 25;
    }

    function setDoors(open) {
      const station = currentStation();
      if (open && (!station || Math.abs(state.speed) > 0.45)) {
        showMessage("Tuerfreigabe nur im Bahnhof bei Halt", 1.8);
        return;
      }
      state.doorsOpen = open;
      doorPanels.forEach(({ door, side, closedZ }) => { door.position.z = closedZ + (open ? side * 0.9 : 0); });
      showMessage(open ? "Tueren geoeffnet" : "Tueren geschlossen", 1.1);
    }

    function derail() {
      if (state.derailTimer > 0) return;
      state.derailTimer = 1.5;
      state.speed = 0;
      state.doorsOpen = false;
      showMessage("Entgleisung", 1.5);
    }

    function resetToValley() {
      state.speed = 0;
      state.trainT = 0.032;
      state.doorsOpen = false;
      state.playerMode = "walking";
      state.playerPosition.set(0, 1.85, -0.4);
      state.derailTimer = 0;
      state.passengerCount = 0;
      doorPanels.forEach(({ door, closedZ }) => { door.position.z = closedZ; });
      showMessage("Talstation", 1.4);
    }

    function updateTrain(dt) {
      if (state.derailTimer > 0) {
        state.derailTimer -= dt;
        if (state.derailTimer <= 0) resetToValley();
        return;
      }
      const drive = (keys.has("ArrowUp") ? 1 : 0) - (keys.has("ArrowDown") ? 1 : 0);
      if (keys.has("Space")) state.speed *= Math.max(0, 1 - dt * 7);
      else if (drive !== 0) state.speed += drive * 9 * dt;
      else state.speed *= Math.max(0, 1 - dt * 0.32);
      state.speed = THREE.MathUtils.clamp(state.speed, -30, 30);
      if (Math.abs(state.speed) > 0.55) {
        if (state.doorsOpen) setDoors(false);
        state.playerMode = "seated";
        state.playerPosition.set(0, 2.0, -3.22);
      }
      if (Math.abs(state.speed) > getSpeedLimit() + 0.7) derail();
      state.trainT = THREE.MathUtils.clamp(state.trainT + (state.speed / 3.6) / mainLength * dt, 0, 1);
      if ((state.trainT === 0 || state.trainT === 1) && Math.abs(state.speed) > 0.1) state.speed = 0;
      const stop = currentStation();
      if (stop && Math.abs(state.speed) < 0.16) {
        state.speed = 0;
        state.playerMode = "walking";
      }
    }

    function updateTrainPose() {
      const frame = frameAt(mainTrackCurve, state.trainT);
      trainRoot.position.copy(frame.point).addScaledVector(UP, 0.48);
      trainRoot.quaternion.copy(new THREE.Quaternion().setFromUnitVectors(FORWARD, frame.tangent));
      if (state.derailTimer > 0) trainRoot.rotateZ(Math.sin((1.5 - state.derailTimer) * 28) * 0.22 + 0.48);
      viewYaw.position.copy(state.playerPosition);
      viewYaw.rotation.y = state.yaw;
      viewPitch.rotation.x = state.pitch + (state.derailTimer > 0 ? Math.sin(state.derailTimer * 40) * 0.06 : 0);
    }

    function updateAiTrain(dt) {
      aiT -= dt * 8 / mainLength;
      if (aiT < 0.02) aiT = 0.98;
      const frame = frameAt(aiTrackCurve, aiT);
      aiTrain.position.copy(frame.point).addScaledVector(UP, 0.45);
      aiTrain.quaternion.copy(new THREE.Quaternion().setFromUnitVectors(FORWARD, frame.tangent.clone().multiplyScalar(-1)));
    }

    function updatePeople(dt) {
      const stop = currentStation();
      if (stop && state.doorsOpen && Math.abs(state.speed) < 0.1) {
        stop.serviceTime += dt;
        if (stop.serviceTime > 1.4) {
          stop.serviceTime = 0;
          const idle = stop.people.find((person) => person.userData.action === "idle" && person.visible);
          const hidden = stop.people.find((person) => !person.visible && person.userData.action === "idle");
          if (state.passengerCount > 0 && hidden && Math.random() > 0.48) {
            hidden.visible = true;
            hidden.position.set(2.0, 0.15, 1.9);
            hidden.userData.action = "exit";
            hidden.userData.progress = 0;
            state.passengerCount -= 1;
          } else if (idle) {
            idle.userData.action = "board";
            idle.userData.progress = 0;
          }
        }
      } else {
        stationData.forEach((station) => { station.serviceTime = 0; });
      }
      stationData.forEach((station) => station.people.forEach((person) => {
        if (person.userData.action === "idle") return;
        person.userData.progress += dt * 0.72;
        const p = Math.min(1, person.userData.progress);
        const door = new THREE.Vector3(2.05, 0.15, 1.9);
        const home = person.userData.home;
        person.position.lerpVectors(person.userData.action === "board" ? home : door, person.userData.action === "board" ? door : home, p);
        if (p >= 1) {
          if (person.userData.action === "board") {
            person.visible = false;
            state.passengerCount += 1;
          }
          person.userData.action = "idle";
        }
      }));
    }

    function updateHikers(dt) {
      hikers.forEach((walker) => {
        walker.userData.t = (walker.userData.t + walker.userData.speed * dt * 10) % 1;
        const position = walker.userData.trail.getPointAt(walker.userData.t);
        const tangent = walker.userData.trail.getTangentAt(walker.userData.t);
        walker.position.copy(position);
        walker.lookAt(position.clone().add(tangent));
      });
    }

    function updateStatus(dt) {
      const station = currentStation();
      speedValue.textContent = String(Math.round(Math.abs(state.speed)));
      const direction = state.speed > 0.2 ? "Bergwaerts" : state.speed < -0.2 ? "Talwaerts" : "Halt";
      status.textContent = `${station ? station.name : "Freie Strecke"} | ${direction} | Limit ${getSpeedLimit()} | Tueren ${state.doorsOpen ? "offen" : "zu"} | ${state.passengerCount}`;
      drawTacho();
      if (state.messageTimer > 0) {
        state.messageTimer -= dt;
        if (state.messageTimer <= 0) message.classList.remove("visible");
      }
    }

    function drawMap() {
      const ctx = mapContext;
      ctx.fillStyle = "#1c2d25";
      ctx.fillRect(0, 0, mapCanvas.width, mapCanvas.height);
      const project = (point) => ({ x: 180 + point.x * 9.4, y: 272 + point.z * 1.95 });
      const drawCurve = (curve, color, width) => {
        ctx.beginPath();
        curve.getSpacedPoints(70).forEach((point, index) => {
          const p = project(point);
          if (index === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
        });
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.stroke();
      };
      drawCurve(mainTrackCurve, "#f2ddb0", 7);
      drawCurve(mainTrackCurve, "#26312d", 2);
      drawCurve(aiTrackCurve, "#aab9ac", 4);
      switches.forEach((switchRoot) => {
        const p = project(switchRoot.position);
        ctx.fillStyle = switchRoot.userData.state ? "#5ecf96" : "#d2a847";
        ctx.fillRect(p.x - 4, p.y - 4, 8, 8);
      });
      stationData.forEach((station) => {
        const p = project(mainTrackCurve.getPointAt(station.t));
        ctx.fillStyle = "#e9f0e8";
        ctx.fillRect(p.x - 3, p.y - 3, 6, 6);
      });
      const own = project(mainTrackCurve.getPointAt(state.trainT));
      ctx.fillStyle = "#4aa2ff";
      ctx.beginPath(); ctx.arc(own.x, own.y, 7, 0, Math.PI * 2); ctx.fill();
    }

    function updateSwitch(root) {
      root.userData.state = !root.userData.state;
      root.userData.blade.rotation.y = root.userData.state ? 0.46 : -0.46;
      root.userData.lever.material.color.set(root.userData.state ? 0x55c88b : 0xd8b14c);
      showMessage(root.userData.state ? "Weiche Abzweig" : "Weiche Gerade", 1.1);
    }

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    function raycastSwitch(event) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hit = raycaster.intersectObjects(clickTargets, false)[0];
      if (hit) updateSwitch(hit.object.userData.switchRoot);
    }

    renderer.domElement.addEventListener("pointerdown", (event) => {
      drag = { x: event.clientX, y: event.clientY, moved: false };
      game.classList.add("dragging");
    });
    renderer.domElement.addEventListener("pointermove", (event) => {
      if (!drag) return;
      const dx = event.clientX - drag.x;
      const dy = event.clientY - drag.y;
      if (Math.abs(dx) + Math.abs(dy) > 2) drag.moved = true;
      state.yaw -= dx * 0.006;
      state.pitch = THREE.MathUtils.clamp(state.pitch - dy * 0.005, -1.42, 1.42);
      drag.x = event.clientX;
      drag.y = event.clientY;
    });
    renderer.domElement.addEventListener("pointerup", (event) => {
      if (drag && !drag.moved) raycastSwitch(event);
      drag = null;
      game.classList.remove("dragging");
    });

    addEventListener("keydown", (event) => {
      if (["ArrowUp", "ArrowDown", "Space"].includes(event.code)) event.preventDefault();
      keys.add(event.code);
      if (event.repeat) return;
      if (event.code === "KeyT") setDoors(true);
      if (event.code === "KeyZ") setDoors(false);
    });
    addEventListener("keyup", (event) => keys.delete(event.code));
    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    function updateWalking(dt) {
      if (state.playerMode !== "walking") return;
      const walk = new THREE.Vector3();
      if (keys.has("KeyW")) walk.z -= 1;
      if (keys.has("KeyS")) walk.z += 1;
      if (keys.has("KeyA")) walk.x -= 1;
      if (keys.has("KeyD")) walk.x += 1;
      if (walk.lengthSq() > 0) {
        walk.normalize().multiplyScalar(dt * 2.25);
        walk.applyAxisAngle(UP, state.yaw);
        state.playerPosition.add(walk);
        state.playerPosition.x = THREE.MathUtils.clamp(state.playerPosition.x, -1.45, 1.45);
        state.playerPosition.z = THREE.MathUtils.clamp(state.playerPosition.z, -3.65, 4.1);
      }
    }

    function frame() {
      requestAnimationFrame(frame);
      const dt = Math.min(clock.getDelta(), 0.05);
      updateTrain(dt);
      updateWalking(dt);
      updateTrainPose();
      updateAiTrain(dt);
      updatePeople(dt);
      updateHikers(dt);
      updateStatus(dt);
      drawMap();
      renderer.render(scene, camera);
    }

    showMessage("Talstation", 1.8);
    frame();
  })();
  </script>
</body>
</html>
